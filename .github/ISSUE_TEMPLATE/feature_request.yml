name: 💡 Feature Request
description: Suggest a new feature or improvement for phpMyCellar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! Please ensure the feature aligns with phpMyCellar's goals as a self-hosted cellar notebook and tasting journal.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Workflow
      description: Describe the solution or workflow you would like to see.
      placeholder: "Add an option to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you considered.
      placeholder: "I considered using..."

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or reference examples.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to verify this feature has not already been requested.
          required: true
